  F6:
    title: "Three-Condition Experimental Design"
    description: >
      Diagram of the three experimental conditions (Control, RAG, Pragmatics)
      showing shared caller model, shared test battery, and condition-specific
      tool access. Illustrates the knowledge representation comparison.
    section: "§4"
