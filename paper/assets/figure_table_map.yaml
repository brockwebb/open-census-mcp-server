# ==========================================================================
# APPENDIX FIGURES
# ==========================================================================

appendix_figures:

  App-F1:
    title: "RAG vs. Pragmatics Sidecar Architecture"
    description: >
      Two-panel comparison. Both panels share User → LLM → MCP Server →
      Census Data API base infrastructure. Left (RAG): LLM also queries a
      client-side Vector DB bolt-on (grey, client-maintained). Right
      (Pragmatics): MCP Server also queries a server-side Pragmatics Sidecar
      (orange, cloud database, server-maintained). Vector DB attaches at the
      client layer; Pragmatics Sidecar attaches at the server layer. No
      Response box — loop closes at User. Census API return arrow shown on
      both sides.
    section: "§6"
    figure_type: paperbanana
    generation:
      tool: paperbanana
      source_file: "paper/assets/diagrams/sidecar_architecture.drawio"
      method_file: "paper/assets/diagrams/fig_sidecar_architecture_method.txt"
      build_command: >
        cd paper/assets/diagrams/paperbanana &&
        paperbanana generate --input sidecar_architecture_method.txt
        --caption "RAG vs Pragmatics: Client-Side Retrieval vs Server-Side Sidecar"
        --vlm-model gemini-3.1-pro-preview
        --image-model gemini-3.1-flash-image-preview
        --iterations 3
      provenance: "run_20260305_184242_ff26e9"
    output:
      paper: "diagrams/fig_sidecar_architecture.png"
      paper_format: png
      paper_dimensions:
        width: 6.5
        height: null
    caption: "RAG vs. pragmatics sidecar architecture. Both architectures share the same MCP server gateway to Census data. The difference is where methodology support attaches: client-side bolt-on (RAG) vs. server-side sidecar (pragmatics)."
    quarto_ref: "#fig-sidecar"
    registry_ids: []
    status: final
    notes: "Rendered via PaperBanana (Nano Banana 2 + gemini-3.1-pro-preview VLM). Method file saved as companion at fig_sidecar_architecture_method.txt."
    slides: []
    variants: {}

  App-F2:
    title: "Deterministic vs. Stochastic Retrieval"
    description: >
      Side-by-side swimlane comparison. Left: RAG pipeline with stochastic
      steps and variance callouts. Right: Pragmatics pipeline with
      deterministic tag match, pre-compiled thread expansion, and identical-output
      guarantee. References DET-001 through DET-004.
    section: "Appendix"
    figure_type: paperbanana
    generation:
      tool: paperbanana
      source_file: "paper/assets/diagrams/deterministic_retrieval.drawio"
      method_file: "paper/assets/diagrams/paperbanana/deterministic_retrieval_method.txt"
      build_command: >
        cd paper/assets/diagrams/paperbanana &&
        paperbanana generate --input deterministic_retrieval_method.txt
        --caption "Deterministic vs. Stochastic Retrieval: Why pragmatics achieve identical context delivery across runs"
        --vlm-model gemini-3.1-pro-preview --image-model gemini-3.1-flash-image-preview
        --iterations 3
      provenance: "run_20260305_184242_9797ca"
    output:
      current: "diagrams/fig_deterministic_retrieval.png"
      paper_format: png
      paper_dimensions:
        width: 6.5
        height: null
    caption: "Deterministic vs. stochastic retrieval. Pragmatics eliminates retrieval variance, isolating it to reasoning only."
    quarto_ref: "#fig-deterministic"
    registry_ids: ["DET-001", "DET-002", "DET-003", "DET-004"]
    status: final
    notes: "Rendered via PaperBanana. Better suited for slides; included in appendix for completeness."
    slides: []
    variants: {}


