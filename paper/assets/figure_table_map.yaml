  F7:
    title: "Evaluation Pipeline (3 Stages)"
    description: >
      Three-stage evaluation pipeline: Stage 1 (agent execution with grounding
      gate verification), Stage 2 (multi-vendor LLM judge scoring with CQS rubric),
      Stage 3 (automated fidelity auditing of cited statistics).
