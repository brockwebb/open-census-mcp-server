# Figure and Table Map — Pragmatics Paper
# Single source of truth for all visual assets.
# Used by: paper build, slide deck generation, asset audits.
#
# Schema version: 1.1
# Last updated: 2026-03-01
#
# Renumbering log (v1.1):
#   - F1: Promoted semiotic_triangle from parking lot (was not_started placeholder)
#   - F3: Promoted ov1_architecture from parking lot (new insertion)
#   - Old F3→F4, F4→F5, F5→F6, F6→F7, F7→F8, F8→F9, F9→F10
#   - App-F1: Sidecar architecture (from parking lot)
#   - App-F2: Deterministic vs stochastic (from parking lot)

metadata:
  paper_title: "Pragmatics as Point-of-Decision Expert Judgment for Federal Statistical Data"
  repo_root: "census-mcp-server"
  style_module: "assets/census_plot_style.py"  # symlink to central_library
  default_paper_format: pdf
  default_paper_dpi: 300
  default_slide_format: png
  default_slide_dpi: 150

# ==========================================================================
# FIGURES
# ==========================================================================
#
# figure_type: plotnine | d2_diagram | mermaid | conceptual | external | paperbanana
# status:      not_started | draft | final | applied
# slides:      list of mappings — same figure can appear on multiple slides
# variants:    keyed dict of alternate renders (e.g., slide_png, thumbnail)

figures:

  F1:
    title: "The Semiotic Stack Applied to Federal Statistical Data"
    description: >
      Three-layer pyramid showing Morris (1938) semiotic triad applied to
      federal data: Syntax (base, solved), Semantics (middle, solved),
      Pragmatics (apex, the gap). Includes concrete Census examples per
      layer and marks pragmatics as this paper's contribution.
    section: "§3"
    figure_type: paperbanana
    generation:
      tool: paperbanana
      source_file: "paper/assets/diagrams/semiotic_triangle.drawio"
      method_file: "paper/assets/diagrams/paperbanana/semiotic_triangle_method.txt"
      build_command: >
        cd paper/assets/diagrams/paperbanana &&
        paperbanana generate --input semiotic_triangle_method.txt
        --caption "The Semiotic Stack Applied to Federal Statistical Data"
        --iterations 3
      provenance: "run_20260305_184238_cc71be"
    output:
      paper: "diagrams/fig_semiotic_stack.png"
      paper_format: png
      paper_dimensions:
        width: 6.5
        height: null
    caption: "The semiotic stack applied to federal statistical data. Federal guidance covers syntax and semantics; pragmatics is the missing layer."
    quarto_ref: "#fig-semiotic-stack"
    registry_ids: []
    status: final
    notes: "Promoted from parking lot (v1.1). Rendered via PaperBanana + Nano Banana 2."
    slides: []
    variants: {}

  F2:
    title: "Semantic Smearing — Combined Two-Panel Figure"
    description: >
      Two-panel stacked figure. Panel A: grouped bar chart showing mean cosine
      similarity across Labels, Raw, and Enriched representations for MiniLM-384
      and RoBERTa-1024. Panel B: within-group vs cross-group similarity for Raw
      and Enriched conditions, faceted by model. Together they demonstrate that
      enrichment increases overall similarity (smearing) while collapsing the
      discrimination gap between groups.
    section: "§2"
    figure_type: plotnine+matplotlib
    generation:
      tool: plotnine (panels) + matplotlib (composition)
      source_script: "paper/assets/generate_figures.py::make_F2"
      source_data:
        - "talks/fcsm_2026/analysis/results/similarity_results_minilm.json"
        - "talks/fcsm_2026/analysis/results/similarity_results_roberta.json"
      build_command: "python paper/assets/generate_figures.py --figure F2"
    output:
      paper: "figures/F2_semantic_smearing.pdf"
      paper_format: pdf
      paper_dimensions:
        width: 6.5
        height: 7.0
    caption: >
      Semantic smearing in federal statistical metadata. Panel A: mean pairwise
      similarity increases with enrichment. Panel B: group discrimination collapses
      as within-group and cross-group similarity converge.
    quarto_ref: "#fig-smearing"
    registry_ids: []
    status: final
    notes: >
      Single two-panel figure replacing former F2a (similarity) and F2b (discrimination)
      subfigures. Panels rendered at 300 DPI PNG then composited into single PDF via matplotlib.
    slides: []
    variants: {}

  F3:
    title: "Pragmatics System Architecture: Authoring and Runtime Pipelines"
    description: >
      Two-panel swimlane architecture diagram. Left panel: Authoring Pipeline
      (Source Documents + SME Interviews → Expert Extraction → Neo4j Knowledge
      Graph → Staging JSON → compile → SQLite Pack). Right panel: Runtime
      Pipeline (User Question → Caller LLM → Pragmatics MCP Server → SQLite
      tag match + thread traversal + Census API → Bundle Context → LLM Reasons
      → Expert-Quality Answer). Separated by Compile Boundary.
    section: "§3"
    figure_type: paperbanana
    generation:
      tool: paperbanana
      source_file: "paper/assets/diagrams/pragmatics_ov1.drawio"
      method_file: "paper/assets/diagrams/paperbanana/pragmatics_ov1_method.txt"
      build_command: >
        cd paper/assets/diagrams/paperbanana &&
        paperbanana generate --input pragmatics_ov1_method.txt
        --caption "Pragmatics System Architecture: Authoring and Runtime Pipelines"
        --iterations 3
      provenance: "run_20260305_184240_4a2899"
    output:
      paper: "diagrams/fig_ov1_architecture.png"
      paper_format: png
      paper_dimensions:
        width: 6.5
        height: null
    caption: "Pragmatics system architecture. Left: human-time authoring pipeline. Right: query-time deterministic retrieval. The compile boundary separates curation from serving."
    quarto_ref: "#fig-ov1-architecture"
    registry_ids: []
    status: final
    notes: "Promoted from parking lot (v1.1). Was OV-1. Rendered via PaperBanana."
    slides: []
    variants: {}

  F4:
    title: "Anatomy of a Pragmatic Context Item"
    description: >
      Structural diagram showing the five components of a pragmatic item:
      context text, latitude classification, trigger conditions, thread
      edges, and provenance citation.
    section: "§3"
    figure_type: d2_diagram
    generation:
      tool: d2
      source_script: "paper/assets/diagrams/F3_pragmatic_item_anatomy.d2"
      source_data: null
      build_command: "d2 --theme 200 --layout elk paper/assets/diagrams/F3_pragmatic_item_anatomy.d2 paper/assets/figures/F4_pragmatic_item_anatomy.pdf"
    output:
      paper: "figures/F4_pragmatic_item_anatomy.pdf"
      paper_format: pdf
      paper_dimensions:
        width: null
        height: null
    caption: null
    quarto_ref: "#fig-pragmatic-anatomy"
    registry_ids: []
    status: final
    notes: "Was F3 (v1.0). D2 source file still named F3_*; output renamed to F4_*."
    slides: []
    variants: {}

  F5:
    title: "Latitude Model — None / Narrow / Wide / Full"
    description: >
      Four-level classification model showing how much interpretive freedom
      a pragmatic item grants to the reasoning model: none (deterministic),
      narrow (constrained), wide (guided), full (open-ended).
    section: "§3"
