title: "Pragmatics as Point-of-Decision Expert Judgment for Federal Statistical Data"
author: "Brock Webb"
date: "March 8, 2026"
thanks: "The views expressed are the author's own and do not necessarily represent the views of the U.S. Census Bureau or the U.S. Department of Commerce."
bibliography: references.bib
csl: apa.csl
link-citations: true
format:
  pdf:
    documentclass: article
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=1in
    number-sections: true
    toc: false
    pdf-engine: xelatex
    latex-max-runs: 4
    mainfont: "Palatino"
    monofont: "Source Code Pro"
    linestretch: 1.25
    include-in-header:
      text: |
        \usepackage{booktabs}
        \usepackage{needspace}
        \usepackage{longtable}
        \usepackage{array}
        \renewcommand{\arraystretch}{1.4}
        \widowpenalty=10000
        \clubpenalty=10000
        \usepackage{caption}
        \captionsetup{justification=raggedright,singlelinecheck=false}
        \hyphenpenalty=10000
        \exhyphenpenalty=10000
        \raggedbottom
        \usepackage{pdflscape}
        \usepackage{float}
        \floatplacement{figure}{htbp}
        \renewcommand{\floatpagefraction}{0.85}
        \renewcommand{\topfraction}{0.85}
        \renewcommand{\textfraction}{0.1}
